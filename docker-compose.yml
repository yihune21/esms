services:
  postgres:
    image: postgres:15-alpine
    container_name: esms-postgres
    environment:
      POSTGRES_DB: esms
      POSTGRES_USER: esms
      POSTGRES_PASSWORD: esms_dev_password
    ports:
      - "5432:5432"
    volumes:
      - esms-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U esms"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: esms-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - esms-rmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 15s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: esms-redis
    ports:
      - "6379:6379"
    volumes:
      - esms-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  esms-core:
    build:
      context: .
      dockerfile: esms-core/Dockerfile
    container_name: esms-core
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: esms
      DB_USER: esms
      DB_PASSWORD: esms_dev_password
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_VHOST: /
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      APP_PORT_CORE: 8080
      JWT_SECRET: dev-secret-key-change-in-production-must-be-at-least-256-bits-long!!
      MOBILE_ENCRYPTION_KEY: ${MOBILE_ENCRYPTION_KEY:-ZGV2LW9ubHktMzItYnl0ZS1tb2JpbGUta2V5ISEhISE=}

      # Active Directory. AD_SERVICE_PASSWORD is never written here — it comes
      # from .env, which is gitignored. Set AD_ENABLED=false to run against
      # local passwords only (e.g. a laptop with no route to the DC).
      AD_ENABLED: ${AD_ENABLED:-true}
      AD_URL: ${AD_URL:-ldaps://NICDCSrv2.nibins.com:636}
      AD_BASE_DN: ${AD_BASE_DN:-DC=nibins,DC=com}
      AD_SERVICE_DN: ${AD_SERVICE_DN:-CN=SMS Service,OU=ServiceAccounts,DC=nibins,DC=com}
      AD_SERVICE_PASSWORD: ${AD_SERVICE_PASSWORD}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8080/actuator/health || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: on-failure

  esms-sender:
    build:
      context: .
      dockerfile: esms-sender/Dockerfile
    container_name: esms-sender
    ports:
      - "8081:8081"
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_VHOST: /
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      APP_PORT_SENDER: 8081
      SENDER_CONCURRENCY_NIB: 50

      NIB_SMSC_HOST: ${NIB_SMSC_HOST}
      NIB_SMSC_PORT: ${NIB_SMSC_PORT}
      NIB_SMSC_SYSTEM_ID: ${NIB_SMSC_SYSTEM_ID}
      NIB_SMSC_PASSWORD: ${NIB_SMSC_PASSWORD}
      NIB_SMSC_SENDER_ID: ${NIB_SMSC_SENDER_ID}
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8081/actuator/health || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: on-failure

volumes:
  esms-pg-data:
  esms-rmq-data:
  esms-redis-data:
