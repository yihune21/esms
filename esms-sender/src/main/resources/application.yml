spring:
  application:
    name: esms-sender

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 20
        concurrency: 5
        max-concurrency: 20

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
    time-zone: UTC

server:
  port: ${APP_PORT_SENDER:8081}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,ready,metrics,info
  endpoint:
    health:
      show-details: when-authorized

app:
  sender:
    concurrency:
      nib-smsc: ${SENDER_CONCURRENCY_NIB:50}

    timeouts:
      connect: PT5S
      read: PT15S

    retry:
      max-attempts: 5
      backoff-steps: "30s,2m,10m,1h"

  gateway:
    # These MUST stay nested under nib-smsc — SmppProperties binds
    # @ConfigurationProperties(prefix = "app.gateway.nib-smsc"). Flattening them
    # one level (which is how this shipped) binds nothing at all: every field
    # silently falls back to its Java default and the password stays null, so
    # the SMPP bind fails with no indication that the NIB_SMSC_* env vars were
    # ignored.
    nib-smsc:
      host: ${NIB_SMSC_HOST:10.204.181.70}
      port: ${NIB_SMSC_PORT:5019}
      system-id: ${NIB_SMSC_SYSTEM_ID:6039}
      # Deliberately no default. Note that an unset env var does NOT fail
      # binding on its own — Spring leaves the literal "${NIB_SMSC_PASSWORD}"
      # in the field — so SmppProperties.validateCredentials() rejects it at
      # startup instead.
      password: ${NIB_SMSC_PASSWORD}
      system-type: ""
      address-range: ""
      source-address-ton: 5
      source-address-npi: 0
      dest-address-ton: 1
      dest-address-npi: 1
      default-sender-id: ${NIB_SMSC_SENDER_ID:NIB}
      enquire-link-timer: 30
      bind-timeout-ms: 10000
      reconnect-delay-ms: 30000
      max-reconnect-attempts: 0

resilience4j:
  circuitbreaker:
    instances:
      nib-smsc:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 50
        failureRateThreshold: 50
        waitDurationInOpenState: 60s
        permittedNumberOfCallsInHalfOpenState: 5
        minimumNumberOfCalls: 10

logging:
  level:
    root: INFO
    et.com.cog.esms: DEBUG
