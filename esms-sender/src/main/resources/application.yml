spring:
  application:
    name: esms-sender

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 20
        concurrency: 5
        max-concurrency: 20

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
    time-zone: UTC

server:
  port: ${APP_PORT_SENDER:8081}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,ready,metrics,info
  endpoint:
    health:
      show-details: when-authorized
      # SmppHealthIndicator reports DEGRADED while the SMPP link is down but a
      # reconnect is pending. Spring Boot knows nothing about a custom status:
      # it is absent from the default severity order and unmapped statuses fall
      # back to HTTP 200, so /actuator/health answered UP for the ~30s of every
      # 40s reconnect cycle spent waiting — a sender incapable of delivering a
      # single message, telling every orchestrator it was fine.
      #
      # Ranked below UP and mapped to 503 so the HTTP contract matches reality,
      # while the body still distinguishes DEGRADED from a hard DOWN.
      #
      # DOWN and OUT_OF_SERVICE are restated deliberately. Spring Boot's
      # SimpleHttpCodeStatusMapper REPLACES its default mapping wholesale as
      # soon as this map is non-empty rather than merging into it, so listing
      # only DEGRADED silently dropped DOWN -> 503 and a hard-down sender
      # started answering 200.
      status:
        order: DOWN,OUT_OF_SERVICE,DEGRADED,UP,UNKNOWN
        http-mapping:
          DOWN: 503
          OUT_OF_SERVICE: 503
          DEGRADED: 503

app:
  sender:
    concurrency:
      nib-smsc: ${SENDER_CONCURRENCY_NIB:50}

    # NOTE: there is deliberately no app.sender.timeouts block here. It used to
    # define connect/read timeouts that nothing read, sitting right next to a
    # real SMPP connect timeout — two settings with the same name, one of them
    # inert. The SMPP timeouts live under app.gateway.nib-smsc below.

    retry:
      max-attempts: 5
      backoff-steps: "30s,2m,10m,1h"

  gateway:
    # These MUST stay nested under nib-smsc — SmppProperties binds
    # @ConfigurationProperties(prefix = "app.gateway.nib-smsc"). Flattening them
    # one level (which is how this shipped) binds nothing at all: every field
    # silently falls back to its Java default and the password stays null, so
    # the SMPP bind fails with no indication that the NIB_SMSC_* env vars were
    # ignored.
    nib-smsc:
      host: ${NIB_SMSC_HOST:10.204.181.70}
      port: ${NIB_SMSC_PORT:5019}
      system-id: ${NIB_SMSC_SYSTEM_ID:6039}
      # Deliberately no default. Note that an unset env var does NOT fail
      # binding on its own — Spring leaves the literal "${NIB_SMSC_PASSWORD}"
      # in the field — so SmppProperties.validateCredentials() rejects it at
      # startup instead.
      password: ${NIB_SMSC_PASSWORD}
      system-type: ""
      address-range: ""
      source-address-ton: 5
      source-address-npi: 0
      dest-address-ton: 1
      dest-address-npi: 1
      default-sender-id: ${NIB_SMSC_SENDER_ID:NIB}
      enquire-link-timer: 30
      # Bounds the TCP connect. Without it jsmpp blocks for the OS SYN-retry
      # default (~130s on Linux), which is what made each failed reconnect cycle
      # take ~2m45s instead of the 30s the log line claims.
      connect-timeout-ms: 10000
      # Bounds the wait for the bind response, once the socket is already open.
      bind-timeout-ms: 10000
      reconnect-delay-ms: 30000
      max-reconnect-attempts: 0

resilience4j:
  circuitbreaker:
    instances:
      nib-smsc:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 50
        failureRateThreshold: 50
        waitDurationInOpenState: 60s
        permittedNumberOfCallsInHalfOpenState: 5
        minimumNumberOfCalls: 10

logging:
  level:
    root: INFO
    et.com.cog.esms: DEBUG
