# ===================================================================
# eSMS-Core — Application Configuration
# ===================================================================
# Profile: default (dev). Override in production via env vars.
# Reference: LLD §15 Configuration Reference
# ===================================================================

spring:
  application:
    name: esms-core

  # --- Database (PostgreSQL) ---
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:esms}
    username: ${DB_USER:esms}
    password: ${DB_PASSWORD:esms_dev_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 5000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public
        jdbc:
          time_zone: UTC

  # --- Flyway ---
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  # --- Redis ---
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000

  # --- RabbitMQ ---
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10

  # --- File uploads ---
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

  # --- Jackson ---
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
    time-zone: UTC

# ===================================================================
# Server
# ===================================================================
server:
  port: ${APP_PORT_CORE:8080}
  error:
    include-message: never
    include-stacktrace: never

# ===================================================================
# Actuator (Health / Ready / Metrics)
# ===================================================================
management:
  endpoints:
    web:
      exposure:
        include: health,ready,metrics,info
  endpoint:
    health:
      show-details: when-authorized

# ===================================================================
# OpenAPI / Swagger
# ===================================================================
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# ===================================================================
# Application-specific configuration
# Matches LLD §15 configuration reference
# ===================================================================
app:
  security:
    jwt:
      secret: ${JWT_SECRET:dev-secret-key-change-in-production-must-be-at-least-256-bits-long!!}
      access-token-ttl: PT5M          # 5 minutes (contractual)
      refresh-token-ttl: PT8H         # 8 hours absolute cap
      issuer: esms-core
    idle-threshold: PT5M               # 5-minute idle timeout (contractual)
    otp:
      ttl: PT5M
      length: 6
      max-attempts: 3
      resend-cooldown: PT30S
      max-resends: 3
    lockout:
      threshold: 5                     # failed attempts before lockout
      duration: PT15M
      ip-threshold: 20
      ip-window: PT15M

  upload:
    max-size: 26214400                 # 25 MB in bytes
    allowed-extensions: xlsx,csv

  campaign:
    recipients-max: 50000

  retention:
    period: P1Y                        # 1 year (contractual)

  ad:
    enabled: ${AD_ENABLED:false}
    url: ${AD_URL:ldaps://ad.nib.internal:636}
    service-dn: ${AD_SERVICE_DN:CN=svc-esms,OU=ServiceAccounts,DC=nib,DC=local}
    service-password: ${AD_SERVICE_PASSWORD:}
    base-dn: ${AD_BASE_DN:OU=Users,DC=nib,DC=local}
    user-search-filter: "(&(objectClass=user)(sAMAccountName={0}))"
    connect-timeout: 2000
    read-timeout: 5000

  scheduler:
    expiry-cron: "0 0 4 * * *"         # 07:00 Africa/Addis_Ababa = 04:00 UTC
    retention-cron: "0 0 2 * * *"      # 02:00 UTC daily
    timezone: Africa/Addis_Ababa

# ===================================================================
# Logging — structured JSON in production
# ===================================================================
logging:
  level:
    root: INFO
    et.com.cog.esms: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
