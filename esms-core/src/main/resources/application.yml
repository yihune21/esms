spring:
  application:
    name: esms-core

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:esms}
    username: ${DB_USER:esms}
    password: ${DB_PASSWORD:esms_dev_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 5000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
    time-zone: UTC

server:
  port: ${APP_PORT_CORE:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,ready,metrics,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

app:
  security:
    jwt:
      secret: ${JWT_SECRET:dev-secret-key-change-in-production-must-be-at-least-256-bits-long!!}
      access-token-ttl: PT5M
      refresh-token-ttl: PT8H
      issuer: esms-core
    idle-threshold: PT5M
    mobile:
      # Base64 AES key protecting app_user.mobile_enc. Staff mobile numbers are
      # a contact-detail field only — sign-in no longer uses them. Rotating this
      # key makes every stored number unreadable until it is re-entered.
      # Dev default only.
      encryption-key: ${MOBILE_ENCRYPTION_KEY:ZGV2LW9ubHktMzItYnl0ZS1tb2JpbGUta2V5ISEhISE=}
    lockout:
      threshold: 5
      duration: PT15M
      ip-threshold: 20
      ip-window: PT15M

  upload:
    max-size: 26214400
    allowed-extensions: xlsx,csv

  campaign:
    recipients-max: 50000

  retention:
    period: P1Y

  # The ONLY Active Directory configuration. A second, contradictory spring.ldap
  # block used to sit above (different host, different base DN) and bound
  # nothing — Spring's LdapProperties has no service-account-* fields, so those
  # keys were silently dropped. ActiveDirectoryProperties reads this block and
  # fails startup if a value is missing rather than at first login.
  ad:
    enabled: ${AD_ENABLED:true}
    # Plain LDAP, not LDAPS: NIC does not run LDAPS and both domain controllers
    # reset every TLS handshake on 636. Simple binds therefore carry passwords
    # in cleartext — ActiveDirectoryProperties logs a WARN about it at startup.
    # Switch to ldaps://…:636 if a certificate is ever installed on the DCs.
    url: ${AD_URL:ldap://NICDCSrv2.nibins.com:389}
    base-dn: ${AD_BASE_DN:DC=nibins,DC=com}
    # Read-only service account, used only to look up the DN of whoever is
    # signing in. Authentication itself is a second bind as that user.
    #
    # NT4 form, not a DN: the account's CN is "SMS Service" (space) while its
    # sAMAccountName is "SMS.Service" (dot), and it sits four OUs deep under
    # OU=Board Of Directors — there is no OU=ServiceAccounts. Binding by account
    # name avoids depending on any of that.
    service-dn: ${AD_SERVICE_DN:nibins\SMS.Service}
    # Deliberately no default — supplied by AD_SERVICE_PASSWORD from .env.
    service-password: ${AD_SERVICE_PASSWORD}
    user-search-filter: "(&(objectClass=user)(sAMAccountName={0}))"
    connect-timeout: 5000
    read-timeout: 5000

  scheduler:
    expiry-cron: "0 0 4 * * *"
    retention-cron: "0 0 2 * * *"
    timezone: Africa/Addis_Ababa

logging:
  level:
    root: INFO
    et.com.cog.esms: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    # org.hibernate.orm.jdbc.bind: TRACE
