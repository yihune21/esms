spring:
  application:
    name: esms-core

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:esms}
    username: ${DB_USER:esms}
    password: ${DB_PASSWORD:esms_dev_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 5000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
    time-zone: UTC
  ldap:
    urls: ldaps://NICDCSrv2.nibins.com:636
    base-dn: DC=nibins,DC=com
    service-account-dn: CN=SMS Service,OU=ServiceAccounts,DC=nibins,DC=com
    service-account-password: ${AD_SERVICE_PASSWORD}
    user-search-base: ""
    user-search-filter: "(sAMAccountName={0})"

server:
  port: ${APP_PORT_CORE:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,ready,metrics,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

app:
  security:
    jwt:
      secret: ${JWT_SECRET:dev-secret-key-change-in-production-must-be-at-least-256-bits-long!!}
      access-token-ttl: PT5M
      refresh-token-ttl: PT8H
      issuer: esms-core
    idle-threshold: PT5M
    mobile:
      # Base64 AES key protecting app_user.mobile_enc. Rotating it makes every
      # stored number unreadable, so OTP login stops working until they are
      # re-entered. Dev default only.
      encryption-key: ${MOBILE_ENCRYPTION_KEY:ZGV2LW9ubHktMzItYnl0ZS1tb2JpbGUta2V5ISEhISE=}
    otp:
      # The seeded administrator may sign in without an OTP for as long as it
      # has no mobile number, so a new deployment can be entered once to set
      # one. Blank disables the bypass.
      bootstrap-username: ${OTP_BOOTSTRAP_USERNAME:superadmin}
      sender-mask: ${OTP_SENDER_MASK:NIB}
      sms-template: "Your NIC eSMS verification code is {otp}. It expires in 5 minutes. Do not share it."
      ttl: PT5M
      length: 6
      max-attempts: 3
      resend-cooldown: PT30S
      max-resends: 3
    lockout:
      threshold: 5
      duration: PT15M
      ip-threshold: 20
      ip-window: PT15M

  upload:
    max-size: 26214400
    allowed-extensions: xlsx,csv

  campaign:
    recipients-max: 50000

  retention:
    period: P1Y

  ad:
    enabled: ${AD_ENABLED:false}
    url: ${AD_URL:ldaps://ad.nib.internal:636}
    service-dn: ${AD_SERVICE_DN:CN=svc-esms,OU=ServiceAccounts,DC=nib,DC=local}
    service-password: ${AD_SERVICE_PASSWORD:}
    base-dn: ${AD_BASE_DN:OU=Users,DC=nib,DC=local}
    user-search-filter: "(&(objectClass=user)(sAMAccountName={0}))"
    connect-timeout: 2000
    read-timeout: 5000

  scheduler:
    expiry-cron: "0 0 4 * * *"
    retention-cron: "0 0 2 * * *"
    timezone: Africa/Addis_Ababa

logging:
  level:
    root: INFO
    et.com.cog.esms: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    # org.hibernate.orm.jdbc.bind: TRACE
